<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>末廣組 現場管理</title>
<style>
:root{
  --green:#06C755;
  --blue:#1677ff;
  --orange:#ff8a00;
  --bg:#f3f5f7;
  --text:#1f2937;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  background:var(--bg);
  color:var(--text);
}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:white}
header{
  padding:16px 18px;
  border-bottom:1px solid #e5e7eb;
  font-weight:800;
  text-align:center;
  position:sticky;top:0;background:#fff;z-index:10;
}
.hero{
  padding:22px 18px;
  background:linear-gradient(135deg,#17324d,#2d526e);
  color:#fff;
}
.hero h1{margin:0;font-size:24px}
.hero p{margin:6px 0 0;opacity:.9}
.screen{display:none;padding:18px}
.screen.active{display:block}
.btn{
  width:100%;border:none;border-radius:12px;color:#fff;
  font-size:19px;font-weight:800;padding:18px;margin:8px 0;
  cursor:pointer;
}
.green{background:var(--green)}
.blue{background:var(--blue)}
.orange{background:var(--orange)}
.gray{background:#6b7280}
.card{
  border:1px solid #e5e7eb;border-radius:14px;padding:16px;margin:12px 0;background:#fff;
}
label{display:block;font-weight:700;margin:14px 0 6px}
select,input,textarea{
  width:100%;padding:13px;border:1px solid #cfd5dc;border-radius:10px;
  font-size:16px;background:white;
}
textarea{min-height:100px}
.row{display:flex;gap:10px}
.row>*{flex:1}
.notice{
  background:#eaf8f0;border-radius:10px;padding:12px;margin-top:12px;color:#17633a;font-weight:700
}
.navback{
  border:none;background:none;color:#1677ff;font-size:16px;padding:0;margin-bottom:8px;cursor:pointer
}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border-bottom:1px solid #e5e7eb;padding:9px 6px;text-align:left}
small{color:#6b7280}
.badge{display:inline-block;background:#eef2f7;border-radius:999px;padding:5px 9px;font-size:12px}
</style>
</head>
<body>
<div class="app">
<header>株式会社末廣組　現場管理</header>

<section id="home" class="screen active">
  <div class="hero">
    <h1>今日も一日・ご安全に</h1>
    <p id="today"></p>
  </div>
  <button class="btn green" onclick="show('clockin')">出勤する</button>
  <button class="btn blue" onclick="show('report')">現場報告をする</button>
  <button class="btn orange" onclick="show('clockout')">退勤する</button>
  <button class="btn gray" onclick="show('list')">今月の出勤を見る</button>
  <button class="btn gray" onclick="openAdmin()">社長・事務員用設定</button>
</section>

<section id="clockin" class="screen">
  <button class="navback" onclick="show('home')">← 戻る</button>
  <h2>出勤登録</h2>
  <div class="card">
    <label>作業員</label>
    <select id="worker" class="workerSelect"></select>

    <label>現場</label>
    <select id="site" class="siteSelect"></select>

    <label>人工</label>
    <select id="unit">
      <option value="1.0">1日</option>
      <option value="0.5">半日</option>
    </select>

    <button class="btn green" onclick="clockIn()">出勤を登録する</button>
    <div id="clockinmsg"></div>
  </div>
</section>

<section id="report" class="screen">
  <button class="navback" onclick="show('home')">← 戻る</button>
  <h2>現場報告</h2>
  <div class="card">
    <label>作業員</label>
    <select id="rworker" class="workerSelect"></select>
    <label>現場</label>
    <select id="rsite" class="siteSelect"></select>
    <label>作業内容</label>
    <textarea id="work" placeholder="例：残土積込、型枠組立、生コン打設、片付け"></textarea>
    <label>写真</label>
    <input id="photo" type="file" accept="image/*" capture="environment">
    <label>備考</label>
    <textarea id="memo" placeholder="例：残土4台搬出"></textarea>
    <button class="btn blue" onclick="saveReport()">この内容で登録</button>
    <div id="reportmsg"></div>
  </div>
</section>

<section id="clockout" class="screen">
  <button class="navback" onclick="show('home')">← 戻る</button>
  <h2>退勤登録</h2>
  <div class="card">
    <label>作業員</label>
    <select id="oworker" class="workerSelect"></select>
    <button class="btn orange" onclick="clockOut()">退勤を登録する</button>
    <div id="clockoutmsg"></div>
  </div>
</section>

<section id="list" class="screen">
  <button class="navback" onclick="show('home')">← 戻る</button>
  <h2>今月の出勤</h2>
  <div class="card">
    <div class="row">
      <span class="badge">端末内の試作品データ</span>
      <button onclick="clearData()">全削除</button>
    </div>
    <div style="overflow:auto;margin-top:12px">
      <table>
        <thead>
          <tr><th>日付</th><th>氏名</th><th>現場</th><th>人工</th><th>出勤</th><th>退勤</th></tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <p><b>合計人工：</b><span id="total">0</span></p>
    <small>※この試作品では、入力内容はこのブラウザ内だけに保存されます。</small>
  </div>
</section>

<section id="adminLogin" class="screen">
  <button class="navback" onclick="show('home')">← 戻る</button>
  <h2>社長・事務員用設定</h2>
  <div class="card">
    <label>暗証番号</label>
    <input id="adminPin" type="password" inputmode="numeric" placeholder="暗証番号を入力">
    <button class="btn gray" onclick="loginAdmin()">管理画面を開く</button>
    <small>初期暗証番号：1234（試作品用）</small>
    <div id="pinmsg"></div>
  </div>
</section>

<section id="admin" class="screen">
  <button class="navback" onclick="show('home')">← ホームへ</button>
  <h2>現場名の管理</h2>

  <div class="card">
    <h3>現場を追加</h3>
    <label>元請名</label>
    <input id="primeName" placeholder="例：㈱ｶﾈｼﾞｭｳ橋本土建">
    <label>現場名</label>
    <input id="siteName" placeholder="例：用宗">
    <button class="btn green" onclick="addSite()">現場を追加する</button>
    <small>元請名だけ、または現場名だけでも登録できます。</small>
  </div>

  <div class="card">
    <h3>登録済み現場</h3>
    <div id="siteAdminList"></div>
  </div>


  <div class="card">
    <h3>作業員を追加</h3>
    <label>氏名</label>
    <input id="newWorkerName" placeholder="例：山田 太郎">
    <label>職種（複数可）</label>
    <div style="display:flex;gap:18px;margin:10px 0">
      <label style="font-weight:500"><input id="jobOpe" type="checkbox" style="width:auto"> オペ</label>
      <label style="font-weight:500"><input id="jobDoko" type="checkbox" style="width:auto"> 土工</label>
    </div>
    <label>資格</label>
    <input id="newWorkerQual" placeholder="例：車両系、玉掛け、1級土木施工管理技士">
    <button class="btn green" onclick="addWorker()">作業員を追加する</button>
  </div>

  <div class="card">
    <h3>登録済み作業員</h3>
    <div id="workerAdminList"></div>
    <small>氏名・職種・資格は後から変更できます。</small>
  </div>

  <div class="card">
    <h3>暗証番号の変更</h3>
    <label>新しい暗証番号</label>
    <input id="newPin" type="password" inputmode="numeric" placeholder="4桁以上">
    <button class="btn gray" onclick="changePin()">暗証番号を変更</button>
    <div id="pinChangeMsg"></div>
  </div>
</section>

</div>

<script>

const defaultWorkers = [
 {name:"田代 豪一",jobs:["オペ"],quals:[]},
 {name:"海野 貴文",jobs:["オペ"],quals:["施工管理技士","普通免許"]},
 {name:"望月 茂",jobs:["土工"],quals:["普通免許"]},
 {name:"野中 康志",jobs:["土工"],quals:["小型車両系"]},
 {name:"青柳 孝義",jobs:["土工"],quals:["小型車両系"]},
 {name:"下谷 健太",jobs:["土工"],quals:[]},
 {name:"小竹 隆史",jobs:["土工"],quals:[]},
 {name:"ドシ",jobs:["土工"],quals:[]},
 {name:"アルワン",jobs:["土工"],quals:[]},
 {name:"内田 末廣",jobs:["オペ"],quals:[]}
];
function getWorkers(){
 const x=JSON.parse(localStorage.getItem('suehiro_workers')||'null');
 return Array.isArray(x)&&x.length?x:defaultWorkers.slice();
}
function saveWorkers(x){
 localStorage.setItem('suehiro_workers',JSON.stringify(x));
  renderWorkerAdmin();
}
function refreshWorkerSelects(){
 const ws=getWorkers();
 document.querySelectorAll('.workerSelect').forEach(sel=>{
   const cur=sel.value; sel.innerHTML='';
   ws.forEach(w=>{const o=document.createElement('option');o.value=w.name;o.textContent=w.name;sel.appendChild(o)});
   if(ws.some(w=>w.name===cur)) sel.value=cur;
 });
}
function renderWorkerAdmin(){
 const box=document.getElementById('workerAdminList'); if(!box)return;
 box.innerHTML='';
 getWorkers().forEach((w,i)=>{
   const div=document.createElement('div');
   div.className='card';
   div.style.margin='8px 0';
   div.innerHTML=`<b>${w.name}</b><br><small>職種：${(w.jobs||[]).join('・')||'未設定'}　資格：${(w.quals||[]).join('、')||'未設定'}</small>
   <div style="display:flex;gap:6px;margin-top:8px"><button onclick="editWorker(${i})">変更</button><button onclick="deleteWorker(${i})">削除</button></div>`;
   box.appendChild(div);
 });
}
function addWorker(){
 const name=document.getElementById('newWorkerName').value.trim(); if(!name)return;
 const jobs=[]; if(document.getElementById('jobOpe').checked)jobs.push('オペ'); if(document.getElementById('jobDoko').checked)jobs.push('土工');
 const quals=document.getElementById('newWorkerQual').value.split(/[、,]/).map(x=>x.trim()).filter(Boolean);
 const ws=getWorkers(); ws.push({name,jobs,quals}); saveWorkers(ws);
 document.getElementById('newWorkerName').value='';document.getElementById('newWorkerQual').value='';
 document.getElementById('jobOpe').checked=false;document.getElementById('jobDoko').checked=false;
}
function editWorker(i){
 const ws=getWorkers(), w=ws[i];
 const name=prompt('氏名',w.name); if(name===null||!name.trim())return;
 const jobs=prompt('職種（オペ、土工など。複数は「、」区切り）',(w.jobs||[]).join('、')); if(jobs===null)return;
 const quals=prompt('資格（複数は「、」区切り）',(w.quals||[]).join('、')); if(quals===null)return;
 ws[i]={name:name.trim(),jobs:jobs.split(/[、,]/).map(x=>x.trim()).filter(Boolean),quals:quals.split(/[、,]/).map(x=>x.trim()).filter(Boolean)};
 saveWorkers(ws);
}
function deleteWorker(i){
 const ws=getWorkers(); if(!confirm(`「${ws[i].name}」を削除しますか？`))return;
 ws.splice(i,1); saveWorkers(ws);
}


const defaultSites = [
  "㈲後藤建設",
  "㈱ｶﾈｼﾞｭｳ橋本土建　用宗",
  "㈱ｶﾈｼﾞｭｳ橋本土建石部",
  "㈱ｶﾈｼﾞｭｳ橋本土建　渋川",
  "㈱丸紅",
  "㈱杉山工務店・伐採",
  "立花ガーデン",
  "水見色",
  "その他"
];

function getSites(){
  const saved = JSON.parse(localStorage.getItem('suehiro_sites') || 'null');
  return Array.isArray(saved) && saved.length ? saved : defaultSites.slice();
}
function saveSites(sites){
  localStorage.setItem('suehiro_sites', JSON.stringify(sites));
  
refreshWorkerSelects();
  renderSiteAdmin();
}
function refreshSiteSelects(){
  const sites = getSites();
  document.querySelectorAll('.siteSelect').forEach(sel=>{
    const current = sel.value;
    sel.innerHTML = '';
    sites.forEach(s=>{
      const o=document.createElement('option');
      o.textContent=s; o.value=s;
      sel.appendChild(o);
    });
    if(sites.includes(current)) sel.value=current;
  });
}
function renderSiteAdmin(){
  const box=document.getElementById('siteAdminList');
  if(!box) return;
  const sites=getSites();
  box.innerHTML='';
  sites.forEach((s,i)=>{
    const row=document.createElement('div');
    row.style.cssText='display:flex;gap:8px;align-items:center;margin:8px 0;';
    row.innerHTML=`
      <input value="${s.replace(/"/g,'&quot;')}" id="siteEdit_${i}" style="flex:1">
      <button onclick="renameSite(${i})">変更</button>
      <button onclick="deleteSite(${i})">削除</button>`;
    box.appendChild(row);
  });
}
function addSite(){
  const prime=document.getElementById('primeName').value.trim();
  const site=document.getElementById('siteName').value.trim();
  let name='';
  if(prime && site) name=prime+'　'+site;
  else name=prime || site;
  if(!name) return;
  const sites=getSites();
  if(!sites.includes(name)) sites.push(name);
  saveSites(sites);
  document.getElementById('primeName').value='';
  document.getElementById('siteName').value='';
}
function renameSite(i){
  const sites=getSites();
  const val=document.getElementById(`siteEdit_${i}`).value.trim();
  if(!val) return;
  sites[i]=val;
  saveSites(sites);
}
function deleteSite(i){
  const sites=getSites();
  if(!confirm(`「${sites[i]}」を削除しますか？`)) return;
  sites.splice(i,1);
  saveSites(sites);
}
function getAdminPin(){
  return localStorage.getItem('suehiro_admin_pin') || '1234';
}
function openAdmin(){
  show('adminLogin');
  document.getElementById('adminPin').value='';
  document.getElementById('pinmsg').innerHTML='';
}
function loginAdmin(){
  const pin=document.getElementById('adminPin').value;
  if(pin===getAdminPin()){
    renderSiteAdmin();
    renderWorkerAdmin();
    show('admin');
  }else{
    document.getElementById('pinmsg').innerHTML='<div class="notice" style="background:#fff0f0;color:#a00">暗証番号が違います</div>';
  }
}
function changePin(){
  const p=document.getElementById('newPin').value.trim();
  if(p.length<4){
    document.getElementById('pinChangeMsg').innerHTML='<div class="notice" style="background:#fff0f0;color:#a00">4桁以上にしてください</div>';
    return;
  }
  localStorage.setItem('suehiro_admin_pin',p);
  document.getElementById('newPin').value='';
  document.getElementById('pinChangeMsg').innerHTML='<div class="notice">暗証番号を変更しました</div>';
}

const pad=n=>String(n).padStart(2,'0');
function now(){
  const d=new Date();
  return {
    date:`${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())}`,
    time:`${pad(d.getHours())}:${pad(d.getMinutes())}`
  };
}


function show(id){
  document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if(id==='list') render();
}

function load(){ return JSON.parse(localStorage.getItem('suehiro_att') || '[]'); }
function save(x){ localStorage.setItem('suehiro_att', JSON.stringify(x)); }

function clockIn(){
  const a=load(), n=now();
  a.push({
    date:n.date,
    worker:document.getElementById('worker').value,
    site:document.getElementById('site').value,
    unit:Number(document.getElementById('unit').value),
    in:n.time,
    out:'',
    report:''
  });
  save(a);
  document.getElementById('clockinmsg').innerHTML=`<div class="notice">出勤を登録しました　${n.time}</div>`;
}

function clockOut(){
  const a=load(), n=now();
  const w=document.getElementById('oworker').value;
  for(let i=a.length-1;i>=0;i--){
    if(a[i].worker===w && !a[i].out){ a[i].out=n.time; break; }
  }
  save(a);
  document.getElementById('clockoutmsg').innerHTML=`<div class="notice">退勤を登録しました　${n.time}</div>`;
}

function saveReport(){
  const a=load(), n=now(), w=document.getElementById('rworker').value, s=document.getElementById('rsite').value;
  const text=document.getElementById('work').value;
  const memo=document.getElementById('memo').value;
  for(let i=a.length-1;i>=0;i--){
    if(a[i].worker===w && a[i].date===n.date){
      a[i].site=s;
      a[i].report=text+(memo?` / ${memo}`:'');
      break;
    }
  }
  save(a);
  document.getElementById('reportmsg').innerHTML=`<div class="notice">現場報告を登録しました</div>`;
}

function render(){
  const a=load();
  const tb=document.getElementById('tbody');
  tb.innerHTML='';
  let total=0;
  a.forEach(r=>{
    total += Number(r.unit||0);
    const tr=document.createElement('tr');
    tr.innerHTML=`<td>${r.date}</td><td>${r.worker}</td><td>${r.site}</td><td>${r.unit}</td><td>${r.in}</td><td>${r.out||'-'}</td>`;
    tb.appendChild(tr);
  });
  document.getElementById('total').textContent=total.toFixed(1);
}
function clearData(){
  if(confirm('試作品データを全部削除しますか？')){
    localStorage.removeItem('suehiro_att'); render();
  }
}

document.addEventListener('DOMContentLoaded', () => {
  refreshSiteSelects();
  refreshWorkerSelects();
  const t = document.getElementById('today');
  if (t) t.textContent = now().date;
});

</script>
</body>
</html>
